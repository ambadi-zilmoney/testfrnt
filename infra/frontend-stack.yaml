AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Hosting + DNS for example.com (frontend) and api.example.com (Docker backend).
  Private S3 bucket behind CloudFront (HTTPS, security headers, SPA routing),
  Route 53 records, and a health check that alerts (and optionally fails over)
  when the API goes down. MUST be deployed in us-east-1 (CloudFront certificate requirement).

Parameters:
  DomainName:
    Type: String
    Default: example.com
    Description: Apex domain for the frontend. The API is served on api.<DomainName>.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone for DomainName.
  ApiServerIp:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}$'
    Description: Public IPv4 of the primary Docker backend server.
  StandbyApiServerIp:
    Type: String
    Default: ""
    Description: >
      Optional public IPv4 of a standby backend server. If set, api.<DomainName> uses
      Route 53 failover routing: traffic moves to the standby when the primary fails its
      health check. The standby must run the same stack and share the database.
  AlertEmail:
    Type: String
    Description: Email that receives "API down / recovered" alerts (confirm the SNS subscription email).

Conditions:
  HasStandby: !Not [!Equals [!Ref StandbyApiServerIp, ""]]
  NoStandby: !Equals [!Ref StandbyApiServerIp, ""]

Resources:
  # ---------------------------------------------------------------------------
  # Frontend: private, versioned S3 bucket (versions allow instant rollback)
  # ---------------------------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Only this CloudFront distribution can read the bucket
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "www.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub "www.${DomainName}"
          HostedZoneId: !Ref HostedZoneId

  WwwRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-www-redirect"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www to the apex domain
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          if (request.headers.host.value.indexOf('www.') === 0) {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://${DomainName}' + request.uri } }
            };
          }
          return request;
        }

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            # connect-src allows the browser to call only the API domain
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.${DomainName}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Frontend for ${DomainName}"
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
            ConnectionAttempts: 3
            ConnectionTimeout: 10
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized (respects Cache-Control)
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WwwRedirectFunction.FunctionMetadata.FunctionARN
        # SPA routing: unknown paths serve index.html (S3 returns 403 for missing keys with OAC)
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  # ---------------------------------------------------------------------------
  # DNS: example.com + www -> CloudFront
  # ---------------------------------------------------------------------------
  ApexRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # fixed zone ID for all CloudFront distributions

  ApexRecordIpv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WwwRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WwwRecordIpv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # ---------------------------------------------------------------------------
  # API: health check, alerts, and DNS (simple or failover)
  # ---------------------------------------------------------------------------
  ApiHealthCheck:
    Type: AWS::Route53::HealthCheck
    Properties:
      HealthCheckConfig:
        Type: HTTPS_STR_MATCH
        IPAddress: !Ref ApiServerIp
        FullyQualifiedDomainName: !Sub "api.${DomainName}"
        EnableSNI: true
        Port: 443
        ResourcePath: /api/ready
        SearchString: '"status":"ok"'
        RequestInterval: 30
        FailureThreshold: 3
      HealthCheckTags:
        - Key: Name
          Value: !Sub "api.${DomainName} (primary)"

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: !Sub "api.${DomainName} alerts"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  ApiDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-down"
      AlarmDescription: !Sub "api.${DomainName} is failing its health check"
      Namespace: AWS/Route53
      MetricName: HealthCheckStatus
      Dimensions:
        - Name: HealthCheckId
          Value: !Ref ApiHealthCheck
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  ApiRecord:
    Type: AWS::Route53::RecordSet
    Condition: NoStandby
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "api.${DomainName}"
      Type: A
      TTL: "60"
      ResourceRecords: [!Ref ApiServerIp]

  ApiRecordPrimary:
    Type: AWS::Route53::RecordSet
    Condition: HasStandby
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "api.${DomainName}"
      Type: A
      TTL: "60"
      SetIdentifier: primary
      Failover: PRIMARY
      HealthCheckId: !Ref ApiHealthCheck
      ResourceRecords: [!Ref ApiServerIp]

  ApiRecordSecondary:
    Type: AWS::Route53::RecordSet
    Condition: HasStandby
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "api.${DomainName}"
      Type: A
      TTL: "60"
      SetIdentifier: secondary
      Failover: SECONDARY
      ResourceRecords: [!Ref StandbyApiServerIp]

Outputs:
  SiteUrl:
    Value: !Sub "https://${DomainName}"
  ApiUrl:
    Value: !Sub "https://api.${DomainName}/api"
  BucketName:
    Description: Pass to the frontend deploy script
    Value: !Ref SiteBucket
  DistributionId:
    Description: Pass to the frontend deploy script (cache invalidation)
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
